<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>핀백 계산기</title>
  <style>
    :root {
      --bg: #f7f4ed;
      --surface: #fffaf0;
      --ink: #171614;
      --muted: #6f665a;
      --line: #ded4c3;
      --accent: #0f766e;
      --accent-strong: #0b5f59;
      --gain: #0f766e;
      --loss: #b42318;
      --neutral: #5e554c;
      --shadow: 0 18px 40px rgba(38, 29, 18, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100svh;
      background:
        radial-gradient(circle at 12% 14%, rgba(15, 118, 110, 0.12), transparent 28rem),
        linear-gradient(135deg, #f7f4ed 0%, #ece2d1 100%);
      color: var(--ink);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 420px);
      gap: 36px;
      align-items: center;
      min-height: 320px;
      padding: 20px 0 32px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(48px, 9vw, 104px);
      line-height: 0.92;
      letter-spacing: 0;
    }

    .hero p {
      max-width: 560px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.65;
    }

    .lane {
      position: relative;
      min-height: 230px;
      border-radius: 8px;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(23, 22, 20, 0.12) 1px, transparent 1px) 0 0 / 68px 100%,
        linear-gradient(180deg, #c99f5e, #9b713b);
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    .lane::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(255,255,255,0.18), transparent 32%, rgba(0,0,0,0.12));
      z-index: 0;
    }

    .pin {
      position: absolute;
      right: 34px;
      bottom: 34px;
      width: 30px;
      height: 84px;
      border-radius: 45% 45% 38% 38%;
      background: linear-gradient(180deg, #fffdf6 0 38%, #b42318 39% 49%, #fffdf6 50% 100%);
      box-shadow: -42px -6px 0 -1px #fffdf6, -84px 3px 0 -2px #fffdf6, -21px -48px 0 -5px #fffdf6, -63px -45px 0 -6px #fffdf6;
      transform: rotate(-5deg);
      z-index: 1;
    }

    .ball {
      position: absolute;
      left: 36px;
      bottom: 32px;
      width: 88px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 28% 25%, #4fd1c5 0 9%, #0f766e 10% 58%, #083f3b 100%);
      box-shadow: 16px 18px 28px rgba(36, 21, 10, 0.35);
      z-index: 1;
      animation: rollIn 900ms cubic-bezier(.2,.8,.2,1) both;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(320px, 1.05fr);
      gap: 24px;
      align-items: start;
    }

    .panel {
      background: rgba(255, 250, 240, 0.9);
      border: 1px solid rgba(222, 212, 195, 0.9);
      border-radius: 8px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .panel-header,
    .panel-body {
      padding: 22px;
    }

    .panel-header {
      border-bottom: 1px solid var(--line);
    }

    .panel-header h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
    }

    .panel-header p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label,
    .label {
      color: var(--neutral);
      font-size: 14px;
      font-weight: 700;
    }

    input[type="number"],
    input[type="text"] {
      width: 100%;
      min-height: 52px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffdf7;
      color: var(--ink);
      font-size: 16px;
      padding: 10px 12px;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    input[type="number"]:focus,
    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.14);
      background: #ffffff;
    }

    .team-count {
      display: grid;
      gap: 10px;
      margin-bottom: 20px;
    }

    .teams {
      display: grid;
      gap: 12px;
    }

    .team-row {
      display: grid;
      grid-template-columns: 1fr 120px;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 247, 0.72);
      animation: rise 260ms ease both;
    }

    .team-row input[data-team-score] {
      font-size: 18px;
      font-weight: 900;
      text-align: right;
    }

    .winner-box {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .winner-options {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .winner-option {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 11px;
      background: #fffdf7;
      color: var(--ink);
      transition: border-color 160ms ease, background 160ms ease;
    }

    .winner-option:has(input:checked) {
      border-color: var(--accent);
      background: rgba(15, 118, 110, 0.1);
    }

    .winner-option input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .notice {
      margin-top: 16px;
      border-radius: 8px;
      background: rgba(180, 35, 24, 0.09);
      color: #822018;
      padding: 12px 14px;
      line-height: 1.5;
      display: none;
    }

    .notice.is-visible {
      display: block;
    }

    .results {
      display: grid;
      gap: 12px;
    }

    .empty {
      min-height: 220px;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
      padding: 24px;
    }

    .result-row {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffdf7;
      overflow: hidden;
      animation: rise 260ms ease both;
    }

    .result-main {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 16px;
    }

    .rank {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .result-name {
      margin-top: 4px;
      font-size: 20px;
      font-weight: 900;
    }

    .result-score {
      margin-top: 4px;
      color: var(--neutral);
      font-size: 14px;
    }

    .amount {
      font-size: clamp(22px, 4vw, 34px);
      font-weight: 950;
      white-space: nowrap;
      text-align: right;
    }

    .amount.gain {
      color: var(--gain);
    }

    .amount.loss {
      color: var(--loss);
    }

    .amount.zero {
      color: var(--neutral);
    }

    details {
      border-top: 1px solid var(--line);
    }

    summary {
      padding: 12px 16px;
      color: var(--neutral);
      font-weight: 800;
      cursor: pointer;
      list-style: none;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    .breakdown {
      display: grid;
      gap: 8px;
      padding: 0 16px 16px;
    }

    .breakdown-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--neutral);
      font-size: 14px;
      line-height: 1.45;
    }

    .breakdown-line strong {
      color: var(--ink);
      white-space: nowrap;
    }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 247, 0.78);
      padding: 12px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .metric strong {
      display: block;
      margin-top: 5px;
      font-size: 18px;
    }

    .mobile-jump {
      position: fixed;
      left: max(14px, env(safe-area-inset-left));
      right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 20;
      min-height: 54px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 14px 34px rgba(15, 118, 110, 0.28);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 900;
    }

    .mobile-jump.is-visible {
      display: none;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes rollIn {
      from {
        opacity: 0;
        transform: translateX(-90px) rotate(-70deg);
      }
      to {
        opacity: 1;
        transform: translateX(0) rotate(0deg);
      }
    }

    @media (max-width: 860px) {
      .shell {
        width: min(100% - 24px, 680px);
        padding-top: 20px;
        padding-bottom: 88px;
      }

      .hero,
      .app {
        grid-template-columns: 1fr;
      }

      .hero {
        gap: 20px;
        min-height: 0;
      }

      .lane {
        min-height: 170px;
      }
    }

    @media (max-width: 560px) {
      body {
        background: linear-gradient(180deg, #f7f4ed 0%, #ece2d1 100%);
      }

      .shell {
        width: min(100% - 20px, 520px);
        padding-top: 14px;
      }

      .hero {
        padding: 8px 0 14px;
      }

      .hero h1 {
        font-size: clamp(40px, 14vw, 58px);
        line-height: 0.95;
      }

      .hero p {
        margin-top: 12px;
        font-size: 15px;
        line-height: 1.5;
      }

      .lane {
        display: none;
      }

      .panel-header,
      .panel-body {
        padding: 14px;
      }

      .panel-header h2 {
        font-size: 19px;
      }

      .panel-header p {
        font-size: 14px;
      }

      .result-main,
      .summary-strip {
        grid-template-columns: 1fr;
      }

      .team-row {
        grid-template-columns: minmax(0, 1fr) minmax(118px, 38%);
        gap: 8px;
        padding: 10px;
      }

      .amount {
        text-align: left;
      }

      .mobile-jump.is-visible {
        display: flex;
      }
    }

    @media (max-width: 360px) {
      .team-row {
        grid-template-columns: 1fr;
      }

      .team-row input[data-team-score] {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero" aria-labelledby="page-title">
      <div>
        <h1 id="page-title">핀백 계산기</h1>
        <p>팀 수와 총 핀수만 입력하면 팀별로 받을 돈과 낼 돈을 바로 계산합니다.</p>
      </div>
      <div class="lane" aria-hidden="true">
        <div class="ball"></div>
        <div class="pin"></div>
      </div>
    </section>

    <section class="app" aria-label="핀백 계산 영역">
      <form class="panel" id="calculatorForm">
        <div class="panel-header">
          <h2>팀 입력</h2>
          <p>총 핀수는 핸디나 팀원 기준을 반영한 최종 점수로 입력하세요.</p>
        </div>
        <div class="panel-body">
          <div class="team-count">
            <div class="field">
              <label for="teamCount">팀 수</label>
              <input id="teamCount" type="number" min="2" max="12" step="1" value="4" inputmode="numeric">
            </div>
          </div>

          <div class="teams" id="teamsContainer"></div>

          <div class="winner-box" id="winnerBox" hidden>
            <div class="label">최종 1등팀</div>
            <div class="winner-options" id="winnerOptions"></div>
          </div>

          <div class="notice" id="notice" role="alert"></div>
        </div>
      </form>

      <section class="panel" id="resultsPanel" aria-live="polite">
        <div class="panel-header">
          <h2>정산 결과</h2>
          <p>상대별 기본 정산은 만원 상한, 최종 1등 보너스는 별도입니다.</p>
        </div>
        <div class="panel-body">
          <div id="summaryStrip" class="summary-strip" hidden></div>
          <div class="results" id="results">
            <div class="empty">팀 점수를 입력하면 결과가 표시됩니다.</div>
          </div>
        </div>
      </section>
    </section>
  </main>

  <button class="mobile-jump" id="mobileJump" type="button" hidden>정산 결과 보기</button>

  <script>
    const MAX_TEAMS = 12;
    const MIN_TEAMS = 2;
    const RATE_PER_PIN = 100;
    const PAIR_CAP = 10000;
    const WINNER_BONUS = 2000;

    const teamCountInput = document.querySelector("#teamCount");
    const teamsContainer = document.querySelector("#teamsContainer");
    const winnerBox = document.querySelector("#winnerBox");
    const winnerOptions = document.querySelector("#winnerOptions");
    const notice = document.querySelector("#notice");
    const results = document.querySelector("#results");
    const resultsPanel = document.querySelector("#resultsPanel");
    const summaryStrip = document.querySelector("#summaryStrip");
    const mobileJump = document.querySelector("#mobileJump");
    let selectedWinnerId = "team-1";

    const won = new Intl.NumberFormat("ko-KR");

    function clampTeamCount(value) {
      const parsed = Number.parseInt(value, 10);
      if (Number.isNaN(parsed)) return MIN_TEAMS;
      return Math.min(MAX_TEAMS, Math.max(MIN_TEAMS, parsed));
    }

    function formatMoney(value, withSign = true) {
      const sign = value > 0 && withSign ? "+" : "";
      return `${sign}${won.format(value)}원`;
    }

    function getTeams() {
      return [...teamsContainer.querySelectorAll(".team-row")].map((row, index) => {
        const nameInput = row.querySelector("[data-team-name]");
        const scoreInput = row.querySelector("[data-team-score]");
        return {
          id: row.dataset.teamId,
          index,
          name: nameInput.value.trim() || `${index + 1}팀`,
          scoreText: scoreInput.value.trim(),
          score: Number(scoreInput.value)
        };
      });
    }

    function renderTeams(count) {
      const currentTeams = getTeams();
      teamsContainer.innerHTML = "";

      for (let i = 0; i < count; i += 1) {
        const previous = currentTeams[i];
        const row = document.createElement("div");
        row.className = "team-row";
        row.dataset.teamId = previous?.id || `team-${i + 1}`;
        row.innerHTML = `
          <div class="field">
            <label for="teamName${i}">팀명</label>
            <input id="teamName${i}" data-team-name type="text" enterkeyhint="next" value="${escapeHtml(previous?.name || `${i + 1}팀`)}">
          </div>
          <div class="field">
            <label for="teamScore${i}">총 핀수</label>
            <input id="teamScore${i}" data-team-score type="number" min="0" step="1" inputmode="numeric" enterkeyhint="next" value="${escapeHtml(previous?.scoreText || "")}">
          </div>
        `;
        teamsContainer.appendChild(row);
      }

      if (!getTeams().some((team) => team.id === selectedWinnerId)) {
        selectedWinnerId = "team-1";
      }

      calculateAndRender();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll('"', "&quot;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function validateTeams(teams) {
      const invalid = teams.find((team) => team.scoreText === "" || !Number.isFinite(team.score) || team.score < 0);
      if (invalid) {
        return `${invalid.name}의 총 핀수를 입력하세요.`;
      }
      return "";
    }

    function renderWinnerOptions(teams) {
      const maxScore = Math.max(...teams.map((team) => team.score));
      const topTeams = teams.filter((team) => team.score === maxScore);
      const showChoice = topTeams.length > 1;
      const candidates = showChoice ? topTeams : teams.filter((team) => team.score === maxScore);

      if (!candidates.some((team) => team.id === selectedWinnerId)) {
        selectedWinnerId = candidates[0]?.id || teams[0].id;
      }

      winnerBox.hidden = false;
      winnerOptions.innerHTML = candidates.map((team) => `
        <label class="winner-option">
          <input type="radio" name="winner" value="${team.id}" ${team.id === selectedWinnerId ? "checked" : ""}>
          <span>${escapeHtml(team.name)} · ${won.format(team.score)}핀${showChoice ? " · 동점 기준으로 선택" : ""}</span>
        </label>
      `).join("");
    }

    function calculateSettlements(teams) {
      const winnerId = selectedWinnerId;
      const totals = new Map(teams.map((team) => [team.id, 0]));
      const details = new Map(teams.map((team) => [team.id, []]));

      for (let i = 0; i < teams.length; i += 1) {
        for (let j = i + 1; j < teams.length; j += 1) {
          const a = teams[i];
          const b = teams[j];
          const diff = Math.abs(a.score - b.score);
          const baseAmount = Math.min(diff * RATE_PER_PIN, PAIR_CAP);
          let aDelta = 0;
          let bDelta = 0;

          if (a.score > b.score) {
            aDelta += baseAmount;
            bDelta -= baseAmount;
          } else if (b.score > a.score) {
            bDelta += baseAmount;
            aDelta -= baseAmount;
          }

          if (a.id === winnerId) {
            aDelta += WINNER_BONUS;
            bDelta -= WINNER_BONUS;
          } else if (b.id === winnerId) {
            bDelta += WINNER_BONUS;
            aDelta -= WINNER_BONUS;
          }

          totals.set(a.id, totals.get(a.id) + aDelta);
          totals.set(b.id, totals.get(b.id) + bDelta);

          details.get(a.id).push({ opponent: b.name, amount: aDelta });
          details.get(b.id).push({ opponent: a.name, amount: bDelta });
        }
      }

      return teams
        .map((team) => ({
          ...team,
          total: totals.get(team.id),
          details: details.get(team.id),
          isWinner: team.id === winnerId
        }))
        .sort((a, b) => b.score - a.score || b.total - a.total || a.index - b.index);
    }

    function amountClass(value) {
      if (value > 0) return "gain";
      if (value < 0) return "loss";
      return "zero";
    }

    function renderSummary(settlements) {
      const winner = settlements.find((team) => team.isWinner);
      const biggestGain = settlements.reduce((best, team) => team.total > best.total ? team : best, settlements[0]);
      const biggestLoss = settlements.reduce((worst, team) => team.total < worst.total ? team : worst, settlements[0]);

      summaryStrip.hidden = false;
      summaryStrip.innerHTML = `
        <div class="metric"><span>최종 1등</span><strong>${escapeHtml(winner.name)}</strong></div>
        <div class="metric"><span>최대 수령</span><strong>${escapeHtml(biggestGain.name)} ${formatMoney(biggestGain.total)}</strong></div>
        <div class="metric"><span>최대 지불</span><strong>${escapeHtml(biggestLoss.name)} ${formatMoney(biggestLoss.total)}</strong></div>
      `;
    }

    function renderResults(settlements) {
      results.innerHTML = settlements.map((team, index) => `
        <article class="result-row">
          <div class="result-main">
            <div>
              <div class="rank">${index + 1}위${team.isWinner ? " · 최종 1등" : ""}</div>
              <div class="result-name">${escapeHtml(team.name)}</div>
              <div class="result-score">${won.format(team.score)}핀</div>
            </div>
            <div class="amount ${amountClass(team.total)}">${formatMoney(team.total)}</div>
          </div>
          <details>
            <summary>상대별 내역</summary>
            <div class="breakdown">
              ${team.details.map((detail) => `
                <div class="breakdown-line">
                  <span>${escapeHtml(detail.opponent)} 상대</span>
                  <strong class="${amountClass(detail.amount)}">${formatMoney(detail.amount)}</strong>
                </div>
              `).join("")}
            </div>
          </details>
        </article>
      `).join("");
    }

    function showNotice(message) {
      notice.textContent = message;
      notice.classList.toggle("is-visible", Boolean(message));
    }

    function renderEmpty(message) {
      summaryStrip.hidden = true;
      summaryStrip.innerHTML = "";
      mobileJump.hidden = true;
      mobileJump.classList.remove("is-visible");
      results.innerHTML = `<div class="empty">${escapeHtml(message)}</div>`;
    }

    function calculateAndRender() {
      const teams = getTeams();
      const validationMessage = validateTeams(teams);

      if (validationMessage) {
        winnerBox.hidden = true;
        winnerOptions.innerHTML = "";
        showNotice(validationMessage);
        renderEmpty("모든 팀의 총 핀수를 입력하면 결과가 표시됩니다.");
        return;
      }

      showNotice("");
      renderWinnerOptions(teams);
      const settlements = calculateSettlements(teams);
      renderSummary(settlements);
      renderResults(settlements);
      mobileJump.hidden = false;
      mobileJump.classList.add("is-visible");
    }

    teamCountInput.addEventListener("change", () => {
      const count = clampTeamCount(teamCountInput.value);
      teamCountInput.value = count;
      renderTeams(count);
    });

    teamCountInput.addEventListener("input", () => {
      const count = clampTeamCount(teamCountInput.value);
      if (String(count) === teamCountInput.value || teamCountInput.value.length > 1) {
        renderTeams(count);
      }
    });

    teamsContainer.addEventListener("input", calculateAndRender);

    winnerOptions.addEventListener("change", (event) => {
      if (event.target.name === "winner") {
        selectedWinnerId = event.target.value;
        calculateAndRender();
      }
    });

    mobileJump.addEventListener("click", () => {
      resultsPanel.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    renderTeams(clampTeamCount(teamCountInput.value));
  </script>
</body>
</html>
